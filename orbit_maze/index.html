<body>
<canvas id="cv"></canvas>
<script>
'use strict';
/* ============================================================
   ORBIT MAZE — a one-finger neon maze game.
   Drag the orb through rotating rings, pulsing circles and
   orbiting hazards to the goal portal. 30 levels, 3 chapters,
   unlockable trails & skins, flow meter, daily challenge.
   Single file, no dependencies, no storage (session progress).
   Dev hook: open with #dev in the URL to unlock everything
   (used for testing cosmetics; harmless in production).
   ============================================================ */

// ---------- tiny utils ----------
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp  = (a, b, t) => a + (b - a) * t;
const dist  = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const angNorm = a => { a %= TAU; return a < 0 ? a + TAU : a; };
const angDist = (a, b) => { const d = angNorm(a - b); return d > Math.PI ? TAU - d : d; };
const easeOutBack = t => { const c = 1.70158; const u = t - 1; return 1 + (c+1)*u*u*u + c*u*u; };
let _seed = 7;
const rnd = () => (_seed = (_seed * 16807) % 2147483647) / 2147483647; // deterministic decor
const mulberry32 = s => () => {
  s |= 0; s = s + 0x6D2B79F5 | 0;
  let t = Math.imul(s ^ s >>> 15, 1 | s);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
};

// ---------- virtual space ----------
const VW = 1000, VH = 1600;                 // portrait design space
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let scrW = 0, scrH = 0, dpr = 1, scl = 1, offX = 0, offY = 0;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  scrW = window.innerWidth; scrH = window.innerHeight;
  cv.width = scrW * dpr; cv.height = scrH * dpr;
  cv.style.width = scrW + 'px'; cv.style.height = scrH + 'px';
  scl = Math.min(scrW / VW, scrH / VH);
  offX = (scrW - VW * scl) / 2;
  offY = (scrH - VH * scl) / 2;
}
window.addEventListener('resize', resize);
resize();
const toVX = px => (px - offX) / scl;
const toVY = py => (py - offY) / scl;

// ---------- themes (chapters shift every 10 levels) ----------
const THEMES = [
  { name:'IGNITION', bg:'#060a14', bg2:'#0d1626', wall:'#1de5ff', hot:'#ff2d95',
    warm:'#ffb347', good:'#7cffb0', text:'#eef4ff', dim:'#8fa3c8' },
  { name:'GRAVITY',  bg:'#0c0714', bg2:'#1a0f26', wall:'#ff9e40', hot:'#b388ff',
    warm:'#ff5470', good:'#7cffb0', text:'#fff3ea', dim:'#c0a8d8' },
  { name:'MASTERY',  bg:'#04120e', bg2:'#0a231c', wall:'#69ff8f', hot:'#ff4f9e',
    warm:'#ffe066', good:'#8fd6ff', text:'#eafff2', dim:'#8fc8ae' },
];
let theme = THEMES[0];
const themeFor = lv => THEMES[Math.min(Math.floor((lv - 1) / 10), THEMES.length - 1)];

// ---------- audio (Web Audio API, all synthesized) ----------
const AudioSys = {
  ac: null, master: null, muted: false, lastWhoosh: 0,
  ensure() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    try {
      this.ac = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ac.createGain();
      this.master.gain.value = this.muted ? 0 : 1;
      this.master.connect(this.ac.destination);
      this.startHum();
    } catch (e) { this.ac = null; }
  },
  setMuted(m) {
    this.muted = m;
    if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 1, this.ac.currentTime, 0.05);
  },
  startHum() {
    const ac = this.ac;
    const g = ac.createGain(); g.gain.value = 0.018; g.connect(this.master);
    for (const f of [55, 55.6, 110.3]) {
      const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      o.connect(g); o.start();
    }
    const lfo = ac.createOscillator(); lfo.frequency.value = 0.07;
    const lg = ac.createGain(); lg.gain.value = 0.008;
    lfo.connect(lg); lg.connect(g.gain); lfo.start();
  },
  tone(freq, dur, { type='sine', vol=0.2, slide=0, delay=0 } = {}) {
    if (!this.ac) return;
    const ac = this.ac, t0 = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t0 + dur);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  noise(dur, { vol=0.25, delay=0, hp=false } = {}) {
    if (!this.ac) return;
    const ac = this.ac, t0 = ac.currentTime + delay;
    const n = Math.floor(ac.sampleRate * dur);
    const buf = ac.createBuffer(1, n, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = ac.createBufferSource(); src.buffer = buf;
    const g = ac.createGain(); g.gain.value = vol;
    const f = ac.createBiquadFilter();
    f.type = hp ? 'highpass' : 'lowpass';
    f.frequency.setValueAtTime(hp ? 1800 : 3200, t0);
    if (!hp) f.frequency.exponentialRampToValueAtTime(300, t0 + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0);
  },
  click()  { this.tone(340, 0.06, { type:'triangle', vol:0.15, slide:-120 }); },
  grab()   { this.tone(220, 0.08, { type:'sine', vol:0.10, slide:90 }); },
  death()  { this.noise(0.4, { vol:0.4 }); this.tone(300, 0.4, { type:'sawtooth', vol:0.12, slide:-240 }); },
  key()    { this.tone(880, 0.09, { vol:0.18 }); this.tone(1320, 0.14, { vol:0.18, delay:0.07 }); },
  tele()   { this.tone(500, 0.18, { type:'triangle', vol:0.2, slide:700 }); },
  win()    { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.28, { vol:0.16, delay: i*0.09 })); },
  star(i)  { this.tone(700 + i*180, 0.14, { vol:0.2 }); },
  tick()   { this.tone(1200, 0.03, { type:'square', vol:0.05 }); },
  equip()  { this.tone(660, 0.1, { vol:0.15 }); this.tone(990, 0.14, { vol:0.15, delay:0.08 }); },
  whoosh() { // near-miss: rate-limited airy hiss
    const now = performance.now();
    if (now - this.lastWhoosh < 260) return;
    this.lastWhoosh = now;
    this.noise(0.12, { vol:0.10, hp:true });
  },
  flowFull(){ this.tone(392, 0.3, { vol:0.12 }); this.tone(588, 0.4, { vol:0.12, delay:0.1 }); },
};

// ---------- adaptive quality (performance guard) ----------
// Q scales every particle spawn count / emission rate. If a frame takes
// >20ms for 30 consecutive frames, quality steps down; long stretches of
// fast frames slowly restore it. Trails therefore can never build up an
// unbounded cost on weak devices.
let Q = 1, slowFrames = 0, fastFrames = 0;
function tuneQuality(rdt) {
  if (rdt > 0.020) { slowFrames++; fastFrames = 0; }
  else { fastFrames++; if (rdt < 0.012) slowFrames = 0; }
  if (slowFrames >= 30) { Q = Math.max(0.35, Q - 0.2); slowFrames = 0; }
  if (fastFrames >= 240 && Q < 1) { Q = Math.min(1, Q + 0.1); fastFrames = 0; }
}

// ---------- pooled particles ----------
const POOL_MAX = 340;
const pool = [];
for (let i = 0; i < POOL_MAX; i++) pool.push({ on:false });
let poolIdx = 0, poolLive = 0;
function spawnP(props) {
  if (poolLive >= POOL_MAX * Q) return null;        // cap scales with quality
  for (let i = 0; i < POOL_MAX; i++) {
    poolIdx = (poolIdx + 1) % POOL_MAX;
    if (!pool[poolIdx].on) break;
  }
  const p = pool[poolIdx];
  if (p.on) return null;
  p.on = true; p.t = 0; p.kind = 'dot'; p.x = 0; p.y = 0; p.vx = 0; p.vy = 0;
  p.grav = 0; p.drag = 2.2; p.r = 4; p.life = 0.8; p.color = '#fff'; p.add = true;
  p.tw = 0; p.rot = 0; p.vr = 0; p.cx = 0; p.cy = 0; p.ang = 0; p.rr = 0;
  p.spin = 0; p.rrv = 0; p.w = 0;
  Object.assign(p, props);
  poolLive++;
  return p;
}
function stepPool(dt) {
  poolLive = 0;
  for (const p of pool) {
    if (!p.on) continue;
    p.t += dt;
    if (p.t >= p.life) { p.on = false; continue; }
    poolLive++;
    if (p.kind === 'vortex') {          // polar spiral (portal suck / star wrap)
      p.rr += p.rrv * dt; p.ang += p.spin * dt;
      p.x = p.cx + Math.cos(p.ang) * p.rr;
      p.y = p.cy + Math.sin(p.ang) * p.rr;
      if (p.rr <= 2 && p.rrv < 0) p.on = false;
    } else {
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= (1 - p.drag * dt); p.vy *= (1 - p.drag * dt);
      p.vy += p.grav * dt;
      p.rot += p.vr * dt;
    }
  }
}
function drawPool() {
  for (const p of pool) {
    if (!p.on) continue;
    const f = 1 - p.t / p.life;
    let alpha = f;
    if (p.tw) alpha *= 0.4 + 0.6 * Math.abs(Math.sin(p.t * p.tw));
    ctx.globalCompositeOperation = p.add ? 'lighter' : 'source-over';
    ctx.globalAlpha = clamp(alpha, 0, 1);
    if (p.kind === 'ringwave') {        // expanding shockwave circle
      ctx.strokeStyle = p.color; ctx.lineWidth = 5 * f;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 + 3.2 * (p.t / p.life)), 0, TAU); ctx.stroke();
    } else if (p.kind === 'confetti') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color; ctx.fillRect(-p.r, -p.r * 0.5, p.r * 2, p.r);
      ctx.restore();
    } else if (p.kind === 'spark') {    // short line along velocity
      ctx.strokeStyle = p.color; ctx.lineWidth = 2.4 * f;
      const l = p.w || 10;
      const m = Math.hypot(p.vx, p.vy) || 1;
      ctx.beginPath(); ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - p.vx / m * l, p.y - p.vy / m * l); ctx.stroke();
    } else {
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0.4, p.r * f), 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}
function burst(x, y, color, n, spd, life, extra = {}) {
  n = Math.max(2, Math.round(n * Q));
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, v = spd * (0.3 + Math.random());
    spawnP({ x, y, vx: Math.cos(a)*v + (extra.bvx||0), vy: Math.sin(a)*v + (extra.bvy||0),
      life, r: 3 + Math.random()*5, color, ...extra.props });
  }
}

// ---------- cosmetics: trails & skins ----------
// Unlocks are driven by total stars (session-only by design). The Golden
// trail additionally requires EVERY level at 3 stars.
const TRAILS = [
  { id:'comet',    name:'COMET',    req:0,  c:()=>theme.wall },
  { id:'fire',     name:'FIRE',     req:10, c:()=> ['#ff9040','#ff5020','#ffc060'][Math.floor(Math.random()*3)] },
  { id:'electric', name:'ELECTRIC', req:25, c:()=>'#aef6ff' },
  { id:'rainbow',  name:'RAINBOW',  req:40, c:t=>`hsl(${(t*140)%360} 100% 65%)` },
  { id:'stardust', name:'STARDUST', req:55, c:()=> Math.random()<0.5 ? '#ffffff' : '#ffe9a0' },
  { id:'shadow',   name:'SHADOW',   req:65, c:()=>'#2a2140' },
  { id:'golden',   name:'GOLDEN',   req:90, all3:true, c:()=>'#ffd700' },
];
const SKINS = [
  { id:'neon',    name:'NEON',       req:0 },
  { id:'planet',  name:'PLANET',     req:5 },
  { id:'eye',     name:'EYEBALL',    req:15 },
  { id:'heart',   name:'HEART',      req:30 },
  { id:'disco',   name:'DISCO',      req:45 },
  { id:'hole',    name:'BLACK HOLE', req:75 },
];
let equippedTrail = 'comet', equippedSkin = 'neon';
const trailById = id => TRAILS.find(t => t.id === id);
function trailUnlocked(tr) {
  if (tr.all3) return progress.every(p => p.stars === 3);
  return totalStars() >= tr.req;
}
const skinUnlocked = sk => totalStars() >= sk.req;

// Trail emission: called wherever a ball moves (game, menu demo, locker).
function emitTrail(x, y, px, py, dt, boost = 1, t = 0) {
  const style = equippedTrail;
  const speed = dist(x, y, px, py) / Math.max(dt, 1e-4);
  const tr = trailById(style);
  const steps = Math.max(1, Math.round((1 + speed / 500) * boost * Q));
  for (let i = 0; i < steps; i++) {
    const k = i / steps, ix = lerp(px, x, k), iy = lerp(py, y, k);
    const col = tr.c(t + k * 0.01);
    if (style === 'comet' || style === 'rainbow' || style === 'golden') {
      spawnP({ x: ix, y: iy, r: (style==='golden'?9:7) * boost, life: 0.5, color: col,
        vx: (Math.random()-0.5)*20, vy: (Math.random()-0.5)*20, drag: 3 });
      if (style === 'golden' && Math.random() < 0.25)
        spawnP({ x: ix, y: iy, r: 2.5, life: 0.9, color:'#fff6c0', tw: 18,
          vx:(Math.random()-0.5)*60, vy:(Math.random()-0.5)*60 });
    } else if (style === 'fire') {
      spawnP({ x: ix + (Math.random()-0.5)*8, y: iy, r: 5 + Math.random()*4,
        life: 0.55, color: col, vy: -60 - Math.random()*80, vx:(Math.random()-0.5)*40,
        grav: -60, drag: 1.5 });
    } else if (style === 'electric') {
      if (Math.random() < 0.35)
        spawnP({ kind:'spark', x: ix, y: iy, w: 14, life: 0.3, color: col,
          vx:(Math.random()-0.5)*260, vy:(Math.random()-0.5)*260, drag: 1 });
    } else if (style === 'stardust') {
      spawnP({ x: ix + (Math.random()-0.5)*14, y: iy + (Math.random()-0.5)*14,
        r: 1.6 + Math.random()*2.4, life: 1.1, color: col, tw: 14, drag: 0.4,
        vx:(Math.random()-0.5)*24, vy:(Math.random()-0.5)*24 });
    } else if (style === 'shadow') {
      spawnP({ x: ix, y: iy, r: 10 * boost, life: 0.8, color: col, add: false,
        vy: -14, drag: 0.8 });
    }
  }
}
// Electric style also draws a jagged polyline over the recent path.
function drawElectricPath(trail) {
  if (equippedTrail !== 'electric' || trail.length < 3) return;
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = '#aef6ff'; ctx.lineWidth = 2.2;
  ctx.globalAlpha = 0.8;
  ctx.beginPath();
  for (let i = 0; i < trail.length - 1; i += 2) {
    const p = trail[i], f = 1 - i / trail.length;
    const jx = (Math.random()-0.5) * 14 * f, jy = (Math.random()-0.5) * 14 * f;
    i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x + jx, p.y + jy);
  }
  ctx.stroke();
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}
// Soft comet body along the path (for the round styles).
function drawTrailBody(trail, ballR, boost) {
  if (!['comet','rainbow','golden','shadow'].includes(equippedTrail)) return;
  const tr = trailById(equippedTrail);
  ctx.globalCompositeOperation = equippedTrail === 'shadow' ? 'source-over' : 'lighter';
  for (let i = 0; i < trail.length; i++) {
    const p = trail[i], f = 1 - i / trail.length;
    ctx.globalAlpha = (equippedTrail === 'shadow' ? 0.30 : 0.16) * f * boost;
    ctx.fillStyle = tr.c(gT + i * 0.02);
    ctx.beginPath(); ctx.arc(p.x, p.y, ballR * f * (boost > 1 ? 1.3 : 1), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

// Ball skins. aimX/aimY = what the eyeball looks at.
function drawBallSkin(x, y, r, t, aimX, aimY) {
  glowCircle(x, y, r * 3.2, equippedSkin === 'hole' ? '#ff8c00' : theme.wall, 0.9);
  switch (equippedSkin) {
    case 'planet': {
      ctx.fillStyle = '#ffb26b';
      ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.beginPath(); ctx.arc(x - r*0.3, y - r*0.3, r*0.35, 0, TAU); ctx.fill();
      ctx.save(); ctx.translate(x, y); ctx.rotate(-0.5);
      ctx.strokeStyle = theme.wall; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(0, 0, r * 1.75, r * 0.55, 0, 0, TAU); ctx.stroke();
      ctx.restore();
      break;
    }
    case 'eye': {
      ctx.fillStyle = '#f4f6ff';
      ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
      const a = Math.atan2(aimY - y, aimX - x);
      const ix = x + Math.cos(a) * r * 0.35, iy = y + Math.sin(a) * r * 0.35;
      ctx.fillStyle = theme.wall;
      ctx.beginPath(); ctx.arc(ix, iy, r * 0.52, 0, TAU); ctx.fill();
      ctx.fillStyle = '#05070d';
      ctx.beginPath(); ctx.arc(ix, iy, r * 0.26, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath(); ctx.arc(ix - r*0.12, iy - r*0.12, r * 0.09, 0, TAU); ctx.fill();
      break;
    }
    case 'heart': {
      const th = 1 + 0.14 * (Math.sin(t * 6) > 0.4 ? Math.sin(t * 12) : 0); // double thump
      ctx.save(); ctx.translate(x, y); ctx.scale(th, th);
      ctx.fillStyle = '#ff4f7e';
      ctx.beginPath();
      ctx.moveTo(0, r * 0.9);
      ctx.bezierCurveTo(-r*1.5, -r*0.3, -r*0.6, -r*1.3, 0, -r*0.4);
      ctx.bezierCurveTo(r*0.6, -r*1.3, r*1.5, -r*0.3, 0, r * 0.9);
      ctx.fill();
      ctx.restore();
      break;
    }
    case 'disco': {
      ctx.fillStyle = '#cfd8ea';
      ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
      ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.clip();
      ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1.2;
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath(); ctx.ellipse(x, y, r, Math.abs(r * i / 2.6) + 1, 0, 0, TAU); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(x, y, Math.abs(r * i / 2.6) + 1, r, t, 0, TAU); ctx.stroke();
      }
      ctx.restore();
      if (Math.random() < 0.2 * Q)
        spawnP({ x: x + (Math.random()-0.5)*2.4*r, y: y + (Math.random()-0.5)*2.4*r,
          r: 2, life: 0.3, color: '#ffffff' });
      break;
    }
    case 'hole': {
      const g = ctx.createRadialGradient(x, y, r * 0.5, x, y, r * 2.1);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(0.55, 'rgba(255,140,0,0.85)');
      g.addColorStop(1, 'rgba(255,60,0,0)');
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r * 2.1, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(x, y, r * 0.85, 0, TAU); ctx.fill();
      break;
    }
    default: { // neon
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
      ctx.fillStyle = theme.wall;
      ctx.beginPath(); ctx.arc(x, y, r * 0.62, 0, TAU); ctx.fill();
    }
  }
}

// ---------- entity constructors ----------
const R  = (x, y, r, speed, gaps, o={}) =>
  ({ k:'ring', x, y, r, th:o.th ?? 22, speed, rot:o.rot ?? 0, gaps, ghost:o.ghost ?? false });
const P  = (x, y, base, amp, speed, o={}) =>
  ({ k:'pulse', x, y, base, amp, speed, ph:o.ph ?? 0 });
const O  = (x, y, R_, speed, o={}) =>
  ({ k:'orb', x, y, R:R_, speed, r:o.r ?? 20, ph:o.ph ?? 0, n:o.n ?? 1 });
const K  = (x, y) => ({ k:'key', x, y, r:20, got:false });
const W  = (x, y, range, pull, o={}) => ({ k:'well', x, y, range, pull, core:o.core ?? 26 });
const T  = (x1, y1, x2, y2) => ({ k:'tele', x1, y1, x2, y2, r:34, cd:0 });
const C  = (x, y, speed) => ({ k:'chaser', x, y, hx:x, hy:y, speed, r:22 });

// ---------- 30 levels ----------
const S = (x=500, y=1430) => ({ x, y });
const G = (x=500, y=260, r=46) => ({ x, y, r });
const LEVELS = [

// ---------- background: 3-layer parallax starfield + shooting stars ----------
const bgLayers = [[], [], []];
for (let l = 0; l < 3; l++) {
  const n = [26, 22, 16][l];
  for (let i = 0; i < n; i++) bgLayers[l].push({
    x: rnd()*VW, y: rnd()*VH, ph: rnd()*TAU });
}
const shooters = [];
let shootTimer = 3;
function stepBG(rdt, t) {
  shootTimer -= rdt;
  if (shootTimer <= 0 && shooters.length < 2) {
    shootTimer = 4 + Math.random() * 6;
    const fromLeft = Math.random() < 0.5;
    shooters.push({
      x: fromLeft ? -40 : VW + 40, y: 100 + Math.random() * 500,
      vx: (fromLeft ? 1 : -1) * (700 + Math.random()*400), vy: 180 + Math.random()*160,
      t: 0, life: 1.4 });
  }
  for (let i = shooters.length - 1; i >= 0; i--) {
    const s = shooters[i];
    s.t += rdt; s.x += s.vx * rdt; s.y += s.vy * rdt;
    if (s.t > s.life || s.x < -80 || s.x > VW + 80) shooters.splice(i, 1);
  }
}
function drawBG(t, parX = 0, parY = 0) {
  ctx.fillStyle = theme.bg;
  ctx.fillRect(-80, -80, VW + 160, VH + 160);
  const g = ctx.createRadialGradient(VW/2, VH*0.42, 60, VW/2, VH*0.42, VH*0.72);
  g.addColorStop(0, theme.bg2); g.addColorStop(1, theme.bg);
  ctx.fillStyle = g; ctx.fillRect(-80, -80, VW + 160, VH + 160);

  for (let l = 0; l < 3; l++) {
    const depth = (l + 1) / 3;                    // far → near
    const drift = t * (2 + l * 3);
    ctx.fillStyle = '#ffffff';
    for (const s of bgLayers[l]) {
      const x = (s.x + drift + parX * depth * 26 + VW) % VW;
      const y = (s.y + parY * depth * 26 + VH) % VH;
      const tw = 0.4 + 0.6 * Math.abs(Math.sin(t * (0.4 + depth) + s.ph));
      ctx.globalAlpha = 0.10 + 0.24 * depth * tw;
      ctx.fillRect(x, y, 1.2 + 1.6 * depth, 1.2 + 1.6 * depth);
    }
  }
  ctx.globalAlpha = 1;
  // shooting stars
  ctx.globalCompositeOperation = 'lighter';
  for (const s of shooters) {
    const f = 1 - s.t / s.life;
    ctx.strokeStyle = `rgba(255,255,255,${0.5 * f})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x - s.vx * 0.09, s.y - s.vy * 0.09);
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
}

// ---------- level lifecycle ----------
function makeRuntime(src) {
  return {
    par: src.par, tl: src.tl || 0, msg: src.msg || '',
    s: { ...src.s }, g: { ...src.g },
    els: src.els.map(e => ({ ...e, gaps: e.gaps ? e.gaps.map(g => ({ ...g })) : undefined })),
    keys: (src.keys || []).map(k => ({ ...k })),
    tps: (src.tps || []).map(t => ({ ...t })),
    chaser: src.chaser ? { ...src.chaser } : null,
  };
}
function loadLevel(i) {
  lvIndex = i; isDaily = false;
  theme = themeFor(i + 1);
  lv = makeRuntime(LEVELS[i]);
  runT = 0; deaths = 0;
  switchState(ST.PLAY);
}
// Daily challenge: procedurally generated, seeded by the calendar date so
// everyone gets the same level each day.
function loadDaily() {
  isDaily = true; lvIndex = -1;
  const d = new Date();
  const seed = d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
  const rng = mulberry32(seed);
  theme = THEMES[seed % 3];
  const els = [];
  const nRings = 3 + Math.floor(rng() * 3);
  for (let i = 0; i < nRings; i++) {
    const r = 150 + i * 85;
    const nG = 1 + Math.floor(rng() * 2);
    const gaps = [];
    for (let g = 0; g < nG; g++)
      gaps.push({ a: rng() * TAU, w: 0.75 + rng() * 0.5 });
    els.push(R(500, 350, r, (rng() < 0.5 ? -1 : 1) * (0.5 + rng() * 0.8), gaps));
  }
  els.push(P(300 + rng()*400, 1000 + rng()*150, 60 + rng()*40, 40, 2 + rng()*1.5));
  if (rng() < 0.6) els.push(O(500, 900 + rng()*200, 180 + rng()*100, 1 + rng(), { n: 1 + Math.floor(rng()*2) }));
  const keys = rng() < 0.5 ? [K(200 + rng()*600, 850 + rng()*250)] : [];
  lv = makeRuntime({ par: 30, tl: 60, msg: 'DAILY CHALLENGE',
    s: S(), g: G(500, 350, 46), els, keys });
  runT = 0; deaths = 0;
  switchState(ST.PLAY);
}
function resetLevel(full) {
  ball.x = ball.tx = ball.px = lv.s.x; ball.y = ball.ty = ball.py = lv.s.y;
  ball.alive = true; ball.trail.length = 0;
  dragging = false; started = false;
  keysLeft = lv.keys.length;
  for (const k of lv.keys) k.got = false;
  timeLeft = lv.tl;
  if (lv.chaser) { lv.chaser.hx = lv.chaser.x; lv.chaser.hy = lv.chaser.y; }
  for (const t of lv.tps) t.cd = 0;
  for (const e of lv.els) if (e.k === 'ring') e._side = null;
  winT = -1; deadT = -1; slowmo = 1; zoom = 1;
  flow = 0; keyFlies = [];
  msgT = full ? 2.6 : 0;
  paused = false;
}

function completeLevel() {
  winT = 0; started = false; dragging = false;
  flowAtWin = flow;
  AudioSys.win();
  if (flowAtWin >= 1) AudioSys.flowFull();
  burst(lv.g.x, lv.g.y, theme.good, 40, 420, 1.1);
  burst(lv.g.x, lv.g.y, theme.wall, 30, 260, 1.3);
  zoomX = lv.g.x; zoomY = lv.g.y;
  stars = (deaths === 0 && runT <= lv.par) ? 3
        : (deaths <= 2 && runT <= lv.par * 2.5) ? 2 : 1;
  if (isDaily) {
    if (!daily.doneToday) { daily.doneToday = true; daily.streak++; }
    return;
  }
  const p = progress[lvIndex];
  p.stars = Math.max(p.stars, stars);
  p.best = p.best ? Math.min(p.best, runT) : runT;
  if (runT < stats.fastestT) { stats.fastestT = runT; stats.fastestLv = lvIndex; }
  if (lvIndex + 1 < LEVELS.length) progress[lvIndex + 1].unlocked = true;
}

function die() {
  if (!ball.alive) return;
  ball.alive = false; deadT = 0; deaths++; stats.deaths++;
  dragging = false; started = false;
  flow = 0;
  shakeT = 0.4; shakeAmp = 16; flashT = 0.12; rgbT = 0.2;
  AudioSys.death();
  // shards inherit the orb's velocity
  const bvx = (ball.x - ball.px) / (1/60), bvy = (ball.y - ball.py) / (1/60);
  burst(ball.x, ball.y, theme.hot, 26, 460, 0.9, { bvx: bvx*0.5, bvy: bvy*0.5 });
  burst(ball.x, ball.y, '#ffffff', 12, 300, 0.7, { bvx: bvx*0.5, bvy: bvy*0.5 });
  spawnP({ kind:'ringwave', x: ball.x, y: ball.y, r: 30, life: 0.6, color: theme.hot });
}

// ---------- flow meter ----------
function gapPassed() {
  stats.gapsPassed++;
  const wasFull = flow >= 1;
  flow = clamp(flow + 0.28, 0, 1);
  flowPulse = 1;
  if (flow >= 1 && !wasFull) AudioSys.flowFull();
}

// ---------- per-frame simulation ----------
function stepPlay(rdt) {
  const dt = rdt * slowmo;

  if (winT >= 0) {
    winT += rdt;
    slowmo = lerp(slowmo, 0.22, 1 - Math.exp(-rdt * 6));
    zoom = lerp(zoom, 1.55, 1 - Math.exp(-rdt * 5));
    if (winT > 1.0) { starAnimT = 0; switchState(ST.COMPLETE); }
  }
  if (deadT >= 0) {
    deadT += rdt;
    if (deadT > 0.55) resetLevel(false);
  }

  if (paused) return;
  if (winT >= 0) { stepEntities(dt); return; }

  if (started && ball.alive) {
    runT += dt;
    stats.trailTime[equippedTrail] += rdt;
    // flow drains slowly while below max; FULL flow is sticky and only a
    // death (or level end) resets it — that's the reward state.
    if (flow < 1) flow = Math.max(0, flow - 0.045 * dt);
    if (lv.tl) {
      const before = Math.ceil(timeLeft);
      timeLeft -= dt;
      if (Math.ceil(timeLeft) !== before && timeLeft > 0 && timeLeft < 6) AudioSys.tick();
      if (timeLeft <= 0) { die(); return; }
    }
  }
  flowPulse = Math.max(0, flowPulse - rdt * 2);

  ball.px = ball.x; ball.py = ball.y;
  if (dragging && ball.alive) {
    ball.tx = clamp(pointer.x + dragOX, ball.r, VW - ball.r);
    ball.ty = clamp(pointer.y + dragOY, ball.r, VH - ball.r);
  }
  if (ball.alive) {
    for (const e of lv.els) if (e.k === 'well') {
      const d = dist(ball.x, ball.y, e.x, e.y);
      if (d < e.range && d > 1) {
        const f = e.pull * (1 - d / e.range);
        ball.tx += (e.x - ball.x) / d * f * dt;
        ball.ty += (e.y - ball.y) / d * f * dt;
      }
    }
    const ease = 1 - Math.exp(-dt * 13);
    ball.x += (ball.tx - ball.x) * ease;
    ball.y += (ball.ty - ball.y) * ease;
    ball.trail.unshift({ x: ball.x, y: ball.y });
    if (ball.trail.length > 22) ball.trail.pop();
    if (started)
      emitTrail(ball.x, ball.y, ball.px, ball.py, dt, flow >= 1 ? 2 : 1, gT);
  }

  stepEntities(dt);
  stepKeyFlies(rdt);
  emitHazardWarnings(dt);

  if (!ball.alive) return;

  // teleporters
  for (const t of lv.tps) {
    t.cd = Math.max(0, t.cd - dt);
    if (t.cd > 0) continue;
    for (const [ax, ay, bx, by] of [[t.x1, t.y1, t.x2, t.y2], [t.x2, t.y2, t.x1, t.y1]]) {
      if (dist(ball.x, ball.y, ax, ay) < t.r) {
        burst(ball.x, ball.y, theme.wall, 14, 300, 0.6);
        ball.x = ball.tx = ball.px = bx; ball.y = ball.ty = ball.py = by;
        if (dragging) { dragOX = bx - pointer.x; dragOY = by - pointer.y; }
        ball.trail.length = 0;
        for (const e of lv.els) if (e.k === 'ring') e._side = null;
        burst(bx, by, theme.wall, 14, 300, 0.6);
        AudioSys.tele();
        t.cd = 1.2;
        break;
      }
    }
  }

  // keys: collected → fly to HUD slot
  for (let ki = 0; ki < lv.keys.length; ki++) {
    const k = lv.keys[ki];
    if (!k.got && dist(ball.x, ball.y, k.x, k.y) < k.r + ball.r) {
      k.got = true; keysLeft--;
      AudioSys.key();
      burst(k.x, k.y, theme.warm, 16, 320, 0.8);
      keyFlies.push({ x: k.x, y: k.y, sx: k.x, sy: k.y,
        tx: 46 + ki * 52, ty: 104, t: 0 });
    }
  }

  // goal
  if (keysLeft === 0 && dist(ball.x, ball.y, lv.g.x, lv.g.y) < lv.g.r * 0.85) {
    completeLevel(); return;
  }

  if (!started) return;
  const br = ball.r * 0.82;
  for (const e of lv.els) {
    if (e.k === 'ring') {
      const d = dist(ball.x, ball.y, e.x, e.y);
      const inBand = Math.abs(d - e.r) < e.th / 2 + br;
      // flow: crossing the ring line while alive = passed through a gap
      const side = d > e.r ? 1 : -1;
      if (e._side !== null && e._side !== undefined && side !== e._side && e.gaps[0].w > 0.1) {
        gapPassed();
      }
      e._side = side;
      if (inBand) {
        const a = Math.atan2(ball.y - e.y, ball.x - e.x);
        const angHalf = br / Math.max(d, 1);
        let safe = false, edge = Infinity;
        for (const g of e.gaps) {
          const dd = angDist(a, g.a + e.rot);
          if (dd < g.w / 2 - angHalf) { safe = true; edge = Math.min(edge, g.w / 2 - angHalf - dd); }
        }
        if (!safe) { die(); return; }
        // near-miss: squeezing close to the gap's edge
        if (edge * d < 26) nearMiss();
      } else if (Math.abs(d - e.r) < e.th / 2 + br + 22) {
        nearMiss(0.35);
      }
    } else if (e.k === 'pulse') {
      const r = e.base + e.amp * Math.sin(e.ph);
      const d = dist(ball.x, ball.y, e.x, e.y);
      if (d < r + br) { die(); return; }
      if (d < r + br + 24) nearMiss();
    } else if (e.k === 'orb') {
      for (let i = 0; i < e.n; i++) {
        const a = e.ph + i * TAU / e.n;
        const ox = e.x + Math.cos(a) * e.R, oy = e.y + Math.sin(a) * e.R;
        const d = dist(ball.x, ball.y, ox, oy);
        if (d < e.r + br) { die(); return; }
        if (d < e.r + br + 24) nearMiss();
      }
    } else if (e.k === 'well') {
      if (dist(ball.x, ball.y, e.x, e.y) < e.core + br) { die(); return; }
    }
  }
  if (lv.chaser && dist(ball.x, ball.y, lv.chaser.hx, lv.chaser.hy) < lv.chaser.r + br) {
    die(); return;
  }
}

let nearMissCD = 0;
function nearMiss(strength = 1) {
  if (nearMissCD > 0) return;
  nearMissCD = 0.28;
  stats.nearMisses++;
  AudioSys.whoosh();
  const bvx = (ball.x - ball.px) * 60, bvy = (ball.y - ball.py) * 60;
  for (let i = 0; i < Math.max(2, 4 * Q * strength); i++) {
    spawnP({ kind:'spark', x: ball.x, y: ball.y, w: 12, life: 0.35, color: '#ffffff',
      vx: -bvx * 0.3 + (Math.random()-0.5)*220, vy: -bvy * 0.3 + (Math.random()-0.5)*220, drag: 1.4 });
  }
}

function stepEntities(dt) {
  for (const e of lv.els) {
    if (e.k === 'ring') e.rot += e.speed * dt;
    else if (e.k === 'pulse') e.ph += e.speed * dt;
    else if (e.k === 'orb') e.ph += e.speed * dt;
  }
  if (lv.chaser && started && ball.alive && winT < 0) {
    const c = lv.chaser;
    const d = dist(c.hx, c.hy, ball.x, ball.y);
    if (d > 1) {
      c.hx += (ball.x - c.hx) / d * c.speed * dt;
      c.hy += (ball.y - c.hy) / d * c.speed * dt;
    }
  }
  // portal vortex particles being sucked in
  if (Math.random() < 0.5 * Q) {
    const a = Math.random() * TAU;
    spawnP({ kind:'vortex', cx: lv.g.x, cy: lv.g.y, ang: a, rr: lv.g.r * 2.4,
      rrv: -lv.g.r * 2.2, spin: 2.6, life: 1.1, r: 2.4,
      color: keysLeft === 0 ? theme.good : theme.dim });
  }
}

function stepKeyFlies(rdt) {
  for (let i = keyFlies.length - 1; i >= 0; i--) {
    const f = keyFlies[i];
    f.t += rdt * 1.8;
    const k = easeOutCubicT(clamp(f.t, 0, 1));
    f.x = lerp(f.sx, f.tx, k); f.y = lerp(f.sy, f.ty, k);
    if (Math.random() < 0.6 * Q)
      spawnP({ x: f.x, y: f.y, r: 3, life: 0.4, color: theme.warm });
    if (f.t >= 1) keyFlies.splice(i, 1);
  }
}
const easeOutCubicT = t => 1 - Math.pow(1 - t, 3);

function emitHazardWarnings(dt) {
  hazardEmitT -= dt;
  if (hazardEmitT > 0 || lv.els.length === 0) return;
  hazardEmitT = 0.5 / Q;
  const e = lv.els[Math.floor(Math.random() * lv.els.length)];
  let x, y, col = theme.hot;
  if (e.k === 'ring' && !e.ghost && e.speed !== 0) {
    const a = Math.random() * TAU; x = e.x + Math.cos(a) * e.r; y = e.y + Math.sin(a) * e.r;
  } else if (e.k === 'pulse') {
    const r = e.base + e.amp * Math.sin(e.ph);
    const a = Math.random() * TAU; x = e.x + Math.cos(a) * r; y = e.y + Math.sin(a) * r;
    col = theme.warm;
  } else if (e.k === 'orb') {
    const a = e.ph; x = e.x + Math.cos(a) * e.R; y = e.y + Math.sin(a) * e.R;
  } else return;
  spawnP({ x, y, r: 2, life: 0.7, color: col,
    vx: (Math.random()-0.5)*30, vy: (Math.random()-0.5)*30, drag: 0.5 });
}

// ---------- drawing ----------
function glowCircle(x, y, r, color, alpha=1) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalAlpha = alpha;
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
}

function strokeRingWithGaps(e, alpha) {
  const segs = [];
  const gaps = e.gaps.map(g => ({ a: angNorm(g.a + e.rot), w: g.w }))
                     .sort((p, q) => p.a - q.a);
  if (gaps.length === 0 || gaps[0].w >= TAU - 0.01) return;
  for (let i = 0; i < gaps.length; i++) {
    const from = gaps[i].a + gaps[i].w / 2;
    const next = gaps[(i + 1) % gaps.length];
    const to = next.a - next.w / 2 + (i === gaps.length - 1 ? TAU : 0);
    if (to > from) segs.push([from, to]);
  }
  const breathe = 0.86 + 0.14 * Math.sin(gT * 1.8 + e.x * 0.013 + e.y * 0.007);
  ctx.lineCap = 'round';
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.28 * alpha * breathe;
  ctx.strokeStyle = e.color; ctx.lineWidth = e.th * 2.1;
  for (const [a, b] of segs) { ctx.beginPath(); ctx.arc(e.x, e.y, e.r, a, b); ctx.stroke(); }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = e.color; ctx.lineWidth = e.th;
  for (const [a, b] of segs) { ctx.beginPath(); ctx.arc(e.x, e.y, e.r, a, b); ctx.stroke(); }
  ctx.globalAlpha = alpha * 0.9 * breathe;
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = e.th * 0.22;
  for (const [a, b] of segs) { ctx.beginPath(); ctx.arc(e.x, e.y, e.r, a, b); ctx.stroke(); }
  ctx.globalAlpha = 1;
}

function drawPortal(x, y, r, open, t) {
  const gp = 1 + 0.12 * Math.sin(t * 3.2);
  glowCircle(x, y, r * 2.6 * gp, theme.good, open ? 0.75 : 0.2);
  // rotating glyph ring
  ctx.save(); ctx.translate(x, y); ctx.rotate(-t * 0.7);
  ctx.strokeStyle = theme.good; ctx.globalAlpha = open ? 0.75 : 0.25; ctx.lineWidth = 3;
  for (let i = 0; i < 12; i++) {
    const a = i * TAU / 12;
    const l = i % 3 === 0 ? 14 : 7;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * (r * 1.4), Math.sin(a) * (r * 1.4));
    ctx.lineTo(Math.cos(a) * (r * 1.4 + l), Math.sin(a) * (r * 1.4 + l));
    ctx.stroke();
    if (i % 4 === 0) {
      ctx.beginPath();
      ctx.arc(Math.cos(a) * (r * 1.62), Math.sin(a) * (r * 1.62), 3.4, 0, TAU);
      ctx.stroke();
    }
  }
  ctx.restore();
  // swirl arms
  ctx.save(); ctx.translate(x, y); ctx.rotate(t * 1.5);
  ctx.strokeStyle = theme.good; ctx.lineWidth = 4;
  ctx.globalAlpha = open ? 0.9 : 0.3;
  for (let arm = 0; arm < 3; arm++) {
    ctx.beginPath();
    for (let k = 0; k <= 10; k++) {
      const rr = r * 0.15 + (r * 0.75) * k / 10;
      const a = arm * TAU / 3 + k * 0.5;
      const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
      k === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.stroke();
  }
  ctx.restore();
  ctx.strokeStyle = theme.good; ctx.lineWidth = 5;
  ctx.globalAlpha = open ? 1 : 0.35;
  ctx.beginPath(); ctx.arc(x, y, r * gp, 0, TAU); ctx.stroke();
  ctx.globalAlpha = 1;
  if (!open) {
    ctx.strokeStyle = theme.dim; ctx.lineWidth = 3;
    ctx.strokeRect(x - 12, y - 8, 24, 20);
    ctx.beginPath(); ctx.arc(x, y - 8, 8, Math.PI, 0); ctx.stroke();
  }
}

function drawPlay(t) {
  for (const e of lv.els) if (e.k === 'well') {
    glowCircle(e.x, e.y, e.range, theme.hot, 0.10);
    ctx.strokeStyle = theme.hot; ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      const rr = e.core + ((t * 60 + i * (e.range - e.core) / 3) % (e.range - e.core));
      ctx.globalAlpha = 0.35 * (1 - (rr - e.core) / (e.range - e.core));
      ctx.beginPath(); ctx.arc(e.x, e.y, rr, 0, TAU); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    glowCircle(e.x, e.y, e.core * 2.2, theme.hot, 0.8);
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(e.x, e.y, e.core * 0.6, 0, TAU); ctx.fill();
  }

  for (const tp of lv.tps) {
    for (const [x, y] of [[tp.x1, tp.y1], [tp.x2, tp.y2]]) {
      const pulse = 1 + 0.1 * Math.sin(t * 4);
      glowCircle(x, y, tp.r * 2 * pulse, theme.wall, 0.35);
      ctx.strokeStyle = theme.wall; ctx.lineWidth = 3;
      ctx.setLineDash([10, 8]); ctx.lineDashOffset = -t * 40;
      ctx.beginPath(); ctx.arc(x, y, tp.r, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  drawPortal(lv.g.x, lv.g.y, lv.g.r, keysLeft === 0, t);

  // keys: spinning light rays
  for (const k of lv.keys) if (!k.got) {
    const bob = Math.sin(t * 3 + k.x) * 4;
    glowCircle(k.x, k.y + bob, k.r * 2.4, theme.warm, 0.6);
    ctx.save(); ctx.translate(k.x, k.y + bob); ctx.rotate(t * 2.2);
    ctx.strokeStyle = theme.warm; ctx.globalAlpha = 0.7; ctx.lineWidth = 2.5;
    for (let i = 0; i < 4; i++) {
      const a = i * TAU / 4;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * k.r * 1.1, Math.sin(a) * k.r * 1.1);
      ctx.lineTo(Math.cos(a) * k.r * 1.9, Math.sin(a) * k.r * 1.9);
      ctx.stroke();
    }
    ctx.restore(); ctx.globalAlpha = 1;
    ctx.fillStyle = theme.warm;
    ctx.beginPath(); ctx.arc(k.x, k.y + bob, k.r * 0.55, 0, TAU); ctx.fill();
    ctx.strokeStyle = theme.warm; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(k.x, k.y + bob, k.r, 0, TAU); ctx.stroke();
  }
  // key fly-to-HUD sprites
  for (const f of keyFlies) {
    glowCircle(f.x, f.y, 26, theme.warm, 0.8);
    ctx.fillStyle = theme.warm;
    ctx.beginPath(); ctx.arc(f.x, f.y, 9, 0, TAU); ctx.fill();
  }

  for (const e of lv.els) {
    if (e.k === 'ring') {
      let alpha = 1;
      if (e.ghost) {
        const d = Math.abs(dist(ball.x, ball.y, e.x, e.y) - e.r);
        alpha = clamp(1 - (d - 90) / 160, 0.06, 1);
      }
      e.color = e.speed === 0 ? theme.wall : theme.hot;
      strokeRingWithGaps(e, alpha);
    } else if (e.k === 'pulse') {
      const r = e.base + e.amp * Math.sin(e.ph);
      glowCircle(e.x, e.y, r * 1.9, theme.warm, 0.5);
      ctx.fillStyle = theme.warm;
      ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath(); ctx.arc(e.x - r*0.25, e.y - r*0.25, r*0.25, 0, TAU); ctx.fill();
    } else if (e.k === 'orb') {
      ctx.strokeStyle = theme.dim; ctx.globalAlpha = 0.22; ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 10]);
      ctx.beginPath(); ctx.arc(e.x, e.y, e.R, 0, TAU); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
      for (let i = 0; i < e.n; i++) {
        const a = e.ph + i * TAU / e.n;
        const ox = e.x + Math.cos(a) * e.R, oy = e.y + Math.sin(a) * e.R;
        glowCircle(ox, oy, e.r * 2.4, theme.hot, 0.6);
        ctx.fillStyle = theme.hot;
        ctx.beginPath(); ctx.arc(ox, oy, e.r, 0, TAU); ctx.fill();
      }
    }
  }

  if (lv.chaser) {
    const c = lv.chaser;
    glowCircle(c.hx, c.hy, c.r * 3, '#ff3333', 0.7);
    ctx.fillStyle = '#ff4444';
    const spikes = 8;
    ctx.beginPath();
    for (let i = 0; i <= spikes * 2; i++) {
      const a = i * Math.PI / spikes + t * 3;
      const rr = i % 2 ? c.r : c.r * 1.5;
      const px = c.hx + Math.cos(a) * rr, py = c.hy + Math.sin(a) * rr;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill();
  }

  if (ball.alive) {
    drawTrailBody(ball.trail, ball.r, flow >= 1 ? 1.6 : 1);
    drawElectricPath(ball.trail);
    drawBallSkin(ball.x, ball.y, ball.r, t, lv.g.x, lv.g.y);
  }

  drawPool();

  // RGB-split death flash: offset red/cyan glows around the impact point
  if (rgbT > 0) {
    const f = rgbT / 0.2;
    ctx.globalCompositeOperation = 'lighter';
    glowCircle(ball.x + 10 * f, ball.y, 260 * f, 'rgba(255,40,40,0.5)', f * 0.6);
    glowCircle(ball.x - 10 * f, ball.y, 260 * f, 'rgba(40,220,255,0.5)', f * 0.6);
    ctx.globalCompositeOperation = 'source-over';
  }
}

// ---------- UI helpers ----------
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function button(x, y, w, h, label, cb, style = {}) {
  buttons.push({ x, y, w, h, cb });
  const grad = ctx.createLinearGradient(x, y, x + w, y);
  grad.addColorStop(0, style.c1 || theme.wall);
  grad.addColorStop(1, style.c2 || theme.hot);
  ctx.save();
  if (!style.flat) { ctx.shadowColor = style.c1 || theme.wall; ctx.shadowBlur = 22; }
  ctx.fillStyle = style.flat ? 'rgba(255,255,255,0.07)' : grad;
  roundRect(x, y, w, h, h / 2); ctx.fill();
  ctx.restore();
  ctx.fillStyle = style.flat ? theme.dim : '#fff';
  ctx.font = `800 ${style.fs || 30}px system-ui,sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, x + w / 2, y + h / 2 + 2);
  ctx.textBaseline = 'alphabetic';
}
function drawStarShape(x, y, r, fill, alpha=1) {
  ctx.save(); ctx.translate(x, y); ctx.globalAlpha = alpha;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI/2 + i * Math.PI / 5;
    const rr = i % 2 ? r * 0.45 : r;
    i === 0 ? ctx.moveTo(Math.cos(a)*rr, Math.sin(a)*rr)
            : ctx.lineTo(Math.cos(a)*rr, Math.sin(a)*rr);
  }
  ctx.closePath();
  if (fill) {
    ctx.shadowColor = theme.warm; ctx.shadowBlur = 18;
    ctx.fillStyle = theme.warm; ctx.fill();
  } else {
    ctx.strokeStyle = theme.dim; ctx.lineWidth = 3; ctx.stroke();
  }
  ctx.restore(); ctx.globalAlpha = 1;
}
function title(txt, y, size, color) {
  ctx.save();
  ctx.shadowColor = color; ctx.shadowBlur = 30;
  ctx.fillStyle = color;
  ctx.font = `900 ${size}px system-ui,sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText(txt, VW/2, y);
  ctx.restore();
}
// Title with gently floating letters.
function floatTitle(txt, cx, y, size, color, t) {
  ctx.save();
  ctx.shadowColor = color; ctx.shadowBlur = 30;
  ctx.fillStyle = color;
  ctx.font = `900 ${size}px system-ui,sans-serif`;
  ctx.textAlign = 'center';
  const widths = [...txt].map(ch => ctx.measureText(ch).width);
  const total = widths.reduce((a, b) => a + b, 0);
  let x = cx - total / 2;
  for (let i = 0; i < txt.length; i++) {
    const dy = Math.sin(t * 1.6 + i * 0.7) * 7;
    ctx.fillText(txt[i], x + widths[i] / 2, y + dy);
    x += widths[i];
  }
  ctx.restore();
}

// ---------- screens ----------
function drawSplash(t) {
  drawBG(t);
  const a = clamp(t / 0.8, 0, 1);
  ctx.globalAlpha = a;
  const pulse = 1 + 0.06 * Math.sin(t * 3);
  ctx.save();
  ctx.translate(VW/2, VH*0.42); ctx.scale(pulse, pulse);
  ctx.strokeStyle = theme.wall; ctx.lineWidth = 8;
  ctx.shadowColor = theme.wall; ctx.shadowBlur = 30;
  ctx.beginPath(); ctx.arc(0, 0, 90, 0.5, 5.6); ctx.stroke();
  ctx.fillStyle = theme.hot; ctx.shadowColor = theme.hot;
  ctx.beginPath(); ctx.arc(62, -62, 18, 0, TAU); ctx.fill();
  ctx.restore();
  title('ORBIT MAZE', VH*0.42 + 190, 84, theme.text);
  ctx.globalAlpha = a * (0.5 + 0.5*Math.sin(t*4));
  ctx.fillStyle = theme.dim; ctx.font = '600 26px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText('tap to begin', VW/2, VH*0.72);
  ctx.globalAlpha = 1;
  if (t > 2.4) switchState(ST.MENU);
}

// Menu demo ball: auto-plays a lissajous path behind the menu with the
// player's equipped trail + skin, so the menu itself previews cosmetics.
let demoBall = { x: 500, y: 430, px: 500, py: 430 };
function drawMenu(t) {
  drawBG(t);
  demoBall.px = demoBall.x; demoBall.py = demoBall.y;
  demoBall.x = 500 + Math.sin(t * 0.9) * 250;
  demoBall.y = 430 + Math.sin(t * 1.8) * 140;
  emitTrail(demoBall.x, demoBall.y, demoBall.px, demoBall.py, 1/60, 0.8, t);

function drawGrid(items, x0, y0, cols, equippedId, unlockedFn, equipFn, iconFn, t) {

    ctx.lineWidth = eq ? 3.5 : 1.5;
    roundRect(x + 8, y, cw - 16, chh - 14, 18); ctx.fill(); ctx.stroke();

    ctx.globalAlpha = un ? 1 : 0.35;

function drawTrailIcon(tr, x, y, t) {
  // little arc of trail particles frozen in place
  const base = ctx.globalAlpha;
  for (let i = 0; i < 7; i++) {
    const k = i / 7;
    const px = x - 34 + k * 68, py = y + Math.sin(k * 5 + t * 3) * 8;
    const f = 0.3 + 0.7 * k;
    ctx.globalCompositeOperation = tr.id === 'shadow' ? 'source-over' : 'lighter';
    ctx.globalAlpha = f * base;
    ctx.fillStyle = tr.c(t + k);
    ctx.beginPath();
    ctx.arc(px, py, tr.id === 'stardust' ? 2.5 + k*2 : 3 + k * 6, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.globalAlpha = base;
}

// ---------- input ----------
function pointerPos(ev) {
  const r = cv.getBoundingClientRect();
  const src = ev.touches ? ev.touches[0] || ev.changedTouches[0] : ev;
  return { x: toVX(src.clientX - r.left), y: toVY(src.clientY - r.top) };
}
function onDown(ev) {
  ev.preventDefault();
  AudioSys.ensure();
  const p = pointerPos(ev);
  pointer.x = p.x; pointer.y = p.y; pointer.down = true;
  for (const b of buttons) {
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { b.cb(); return; }
  }
  if (state === ST.SPLASH) { switchState(ST.MENU); AudioSys.click(); return; }
  if (state === ST.PLAY && !paused && ball.alive && winT < 0) {
    dragging = true;
    dragOX = ball.x - p.x; dragOY = ball.y - p.y;
    if (!started) { started = true; AudioSys.grab(); }
  }
}
function onMove(ev) {
  ev.preventDefault();
  const p = pointerPos(ev);
  pointer.x = p.x; pointer.y = p.y;
}
function onUp(ev) {
  ev.preventDefault();
  pointer.down = false; dragging = false;
}
if (window.PointerEvent) {
  cv.addEventListener('pointerdown', onDown, { passive:false });
  cv.addEventListener('pointermove', onMove, { passive:false });
  cv.addEventListener('pointerup', onUp, { passive:false });
  cv.addEventListener('pointercancel', onUp, { passive:false });
} else {
  cv.addEventListener('touchstart', onDown, { passive:false });
  cv.addEventListener('touchmove', onMove, { passive:false });
  cv.addEventListener('touchend', onUp, { passive:false });
  cv.addEventListener('mousedown', onDown);
  cv.addEventListener('mousemove', onMove);
  cv.addEventListener('mouseup', onUp);
}

// ---------- main loop ----------
let lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let rdt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;
  stateT += rdt; gT += rdt;
  tuneQuality(rdt);

  buttons = [];

  if (fadeTo !== null) {
    fade = Math.min(fade + rdt * 4, 1);
    if (fade >= 1) { applyState(fadeTo); fadeTo = null; }
  } else if (fade > 0) fade = Math.max(fade - rdt * 3, 0);

  if (state === ST.PLAY && fadeTo === null) stepPlay(rdt);
  stepPool(rdt);
  stepBG(rdt, gT);
  if (shakeT > 0) shakeT -= rdt;
  if (flashT > 0) flashT -= rdt;
  if (rgbT > 0) rgbT -= rdt;
  if (msgT > 0) msgT -= rdt;
  if (nearMissCD > 0) nearMissCD -= rdt;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = theme.bg; ctx.fillRect(0, 0, scrW, scrH);
  ctx.setTransform(dpr * scl, 0, 0, dpr * scl, dpr * offX, dpr * offY);

  const t = stateT;
  switch (state) {
    case ST.SPLASH:   drawSplash(t); break;
    case ST.MENU:     drawMenu(t); break;
    case ST.SELECT:   drawSelect(t); drawPool(); break;
    case ST.COMPLETE: drawComplete(t); break;
    case ST.LOCKER:   drawLocker(t); break;
    case ST.STATS:    drawStats(t); break;
    case ST.CHAPTER:  drawChapter(t); drawPool(); break;
    case ST.PLAY: {
      ctx.save();
      if (zoom !== 1) {
        ctx.translate(zoomX, zoomY); ctx.scale(zoom, zoom);
        ctx.translate(-zoomX, -zoomY);
      }
      if (shakeT > 0) {
        const sh = shakeAmp * (shakeT / 0.4);
        ctx.translate((Math.random()*2-1)*sh, (Math.random()*2-1)*sh);
      }
      // parallax reacts subtly to orb position
      drawBG(t, (ball.x - VW/2) / VW * -2, (ball.y - VH/2) / VH * -2);
      drawPlay(t);
      ctx.restore();
      drawFlowVignette();
      drawHUD(t);
      if (paused) drawPauseOverlay();
      break;
    }
  }

  if (flashT > 0) {
    ctx.fillStyle = `rgba(255,255,255,${(flashT / 0.12) * 0.3})`;
    ctx.fillRect(-80, -80, VW + 160, VH + 160);
  }
  if (fade > 0) {
    ctx.fillStyle = `rgba(3,5,10,${fade})`;
    ctx.fillRect(-80, -80, VW + 160, VH + 160);
  }
}
requestAnimationFrame(frame);
</script>
</body>
