name: orbit_dash
description: "Orbit Dash — a one-tap hypercasual arcade game. Tap to reverse your orbit, dodge the arcs, collect orbs."
publish_to: 'none'

# versionName+versionCode for Android. Bump the +N build number on every
# Play Store upload (each upload needs a higher versionCode).
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flame: ^1.37.0
  flame_audio: ^2.12.1
  google_mobile_ads: ^9.0.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
